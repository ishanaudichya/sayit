name: SayIt
options:
  bundleIdPrefix: dev.ishan
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
targets:
  SayIt:
    type: application
    platform: macOS
    sources:
      - path: Sources/SayIt
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: SayIt
        PRODUCT_BUNDLE_IDENTIFIER: dev.ishan.sayit
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "SayIt listens while you hold the Fn key and transcribes your speech entirely on this Mac."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "SayIt transcribes your speech on-device. Nothing leaves this Mac."
        INFOPLIST_KEY_CFBundleDisplayName: SayIt
