name: SayIt
options:
  bundleIdPrefix: dev.ishan
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
targets:
  SayIt:
    type: application
    platform: macOS
    sources:
      - path: Sources/SayIt
    scheme: {}
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: SayIt
        CFBundleIconFile: AppIcon
        LSUIElement: true
        NSPrincipalClass: NSApplication
        NSMicrophoneUsageDescription: "SayIt listens while you hold the Fn key and transcribes your speech entirely on this Mac."
        NSSpeechRecognitionUsageDescription: "SayIt transcribes your speech on-device. Nothing leaves this Mac."
    settings:
      base:
        PRODUCT_NAME: SayIt
        PRODUCT_BUNDLE_IDENTIFIER: dev.ishan.sayit
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
